# pyproject.toml

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cramspeech"
version = "0.0.0"
dependencies = [
    "faster-whisper>=1.2.1",
    "krrood>=26.10.0",
    "llama-cpp-python>=0.3.36",
    "numpy",
    "sounddevice>=0.5.6",
    "typing_extensions>=4.12.2",
]
description = "Speech for CRAM: transcribes a microphone with Whisper and turns spoken instructions into plans."
readme = "README.md"
authors = [{ name = "Jan Witt", email = "jan9@uni-bremen.de" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
]
keywords = ["robotics", "speech recognition", "whisper", "pycram"]
requires-python = ">=3.11"


[project.scripts]
nlp-listen = "cramspeech.speech_node:ListenCommandLine.run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cramspeech*"]

[tool.setuptools.package-data]
"cramspeech.inference" = ["resources/*"]

[dependency-groups]
workspace = [
    "krrood",
]

[project.urls]
Homepage = "https://github.com/cram2/cognitive_robot_abstract_machine"
